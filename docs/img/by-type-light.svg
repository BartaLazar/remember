<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img" aria-label="Tokens saved versus careful grepping: behaviour questions +65%, exact names +48%, keywords +56%, free-form -3%, other language -72%">
